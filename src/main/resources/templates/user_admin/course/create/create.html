<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey | Create course</title>

    <!-- Favicon & CSS -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/create-course.css">

    <!-- JS -->
    <script defer src="/js/upload-degree-courses.js"></script>
    <script defer src="/js/upload-professors.js"></script>
</head>
<body>

    <header class="main-header">
        <h1>Create new course</h1>
    </header>

    <main class="form-container">
        <form th:action="@{/api/v1/course/create}"
            th:object="${course}"
            method="post"
            class="course-form">

            <div class="form-group">
                <label for="name">Course name</label>
                <input type="text" id="name" th:field="*{name}"
                    placeholder="Enter course name"
                    title="Enter course name" required>
            </div>

            <div class="form-group">
                <label for="type-select">Course type</label>
                <select id="type-select" th:field="*{type}" title="Select course type" required>
                    <option value="" disabled selected>Select a type</option>
                    <option th:each="type : ${T(com.alex.universitymanagementsystem.enum_type.CourseType).values()}"
                            th:value="${type}"
                            th:text="${type.name()}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="cfu">CFU</label>
                <input type="number" id="cfu" th:field="*{cfu}"
                    placeholder="Enter CFU"
                    title="Enter credits" required>
            </div>

            <div class="form-group">
                <label for="yearOfStudy">Year of study</label>
                <input type="number" id="yearOfStudy" th:field="*{yearOfStudy}"
                    placeholder="Enter year of study"
                    title="Enter year of study" required>
            </div>

            <div class="form-group">
                <label for="professor">Professor</label>
                <select id="professor" th:field="*{professorCode}" required>
                    <option value="">-- Select a professor --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="degreeCourse">Degree course</label>
                <select id="degreeCourse" th:field="*{degreeCourseName}" required>
                    <option value="">-- Select a degree course --</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>

        <div class="back-link">
            <a th:href="@{/user_admin/course/course-menu}">← Back to Menu</a>
        </div>
    </main>

</body>
</html>
