<script src="/static/js/filtering-users-for-selection.js" defer></script>

<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/static/css/user-selection.css">
    <script src="/static/js/filtering-users-for-selection.js" defer></script>
</head>
<body>

<header>
    <h1>Users management</h1>
</header>

<main>
    <div class="table-container">

        <!-- Search bar -->
        <div class="search-container">
            <input type="text" id="userSearch" placeholder="🔍 Search users...">
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cardsGrid">
            <div class="card" th:each="user : ${users}">
                <div class="card-header">
                    <span th:text="${user.username}" class="card-username"></span>
                    <span th:text="${user.role}" class="card-role"></span>
                </div>
                <div class="card-body">
                    <p><strong>Name:</strong> <span th:text="${user.firstName + ' ' + user.lastName}"></span></p>
                    <p><strong>DOB:</strong> <span th:text="${#temporals.format(user.dob, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Fiscal Code:</strong> <span th:text="${user.fiscalCode}"></span></p>
                    <p><strong>Address:</strong> <span th:text="${user.address.street + ', ' + user.address.city + ', ' + user.address.state + ' ' + user.address.zipCode}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
                </div>
                <div class="card-footer">
                    <a th:href="@{/user_admin/update-user(formUsername=${user.username})}" class="btn update-btn">Update</a>
                    <a th:href="@{/user_admin/delete-user-confirm(formUsername=${user.username})}" class="btn delete-btn">Delete</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Menu -->
    <div class="form-actions">
        <a th:href="@{/user_admin/admin/admin-menu}" class="home-link">Back to Menu</a>
    </div>
</main>

</body>
</html>
