<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey — Degree Course Catalog</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/degree-courses-catalog.css">

    <!-- JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <script src="/js/degree-courses-catalog.js" defer></script>
</head>

<body>
<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>
        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<main class="container fade-in">
    <h2 class="page-title">Consult the degree course catalog and available study plans</h2>

    <div class="catalog-grid">
        <div class="degree-card" th:each="degreeCourse : ${degreeCourses}">
            <h3 th:text="${degreeCourse.name}">Degree Course Name</h3>
            <p><strong>Graduation class:</strong> <span th:text="${degreeCourse.graduationClass}">L-31</span></p>
            <p><strong>Duration:</strong> <span th:text="${degreeCourse.duration}">3</span> years</p>

            <button class="btn view-btn" type="button">
                <i class="fas fa-eye"></i> View study plan
            </button>

            <div class="courses-list hidden">
                <p class="placeholder">
                    Study plan details not available in this view.
                </p>
            </div>
        </div>
    </div>

    <div class="back-link">
        <a th:href="@{/home}" class="btn secondary-btn">Back to home</a>
    </div>
</main>
</body>
</html>
