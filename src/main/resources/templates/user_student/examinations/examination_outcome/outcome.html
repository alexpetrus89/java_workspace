<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/outcome.css">
</head>
<body>

<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>
        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<main class="content-wrapper">
    <section class="card-container">
        <div class="card">
            <h1 class="title">📋 Select appeal</h1>

            <div class="error-message" th:if="${errorMessage}">
                <p th:text="${errorMessage}"></p>
            </div>

            <input type="text" id="appealFilter" placeholder="🔍 Search appeals by course, degree or date..." class="filter-input">

            <div class="appeal-list">
                <form th:action="@{/api/v1/examination-outcome/read/outcome}" method="get">
                    <div th:each="outcome : ${outcomes}" 
                         class="appeal-card" 
                         th:data-search="${outcome.appeal.degreeCourse + ' ' + outcome.appeal.course + ' ' + outcome.appeal.date}">

                        <!-- Label cliccabile con checkbox dentro -->
                        <label class="clickable-label">
                            <input type="checkbox" name="id" th:value="${outcome.id}" th:id="'appeal-' + ${outcome.id}" class="sr-only">

                            <div class="card-content">
                                <div class="course">
                                    <i class="fas fa-book"></i>
                                    <span th:text="${outcome.appeal.degreeCourse}">Degree</span>
                                </div>
                                <div class="details">
                                    <span th:text="${outcome.appeal.course}">Course</span> •
                                    <span th:text="${outcome.appeal.date}">Date</span>
                                </div>
                                <div class="description" th:text="${outcome.appeal.description}">Description</div>
                            </div>
                            <div class="checkmark"><i class="fas fa-check-circle"></i></div>
                        </label>

                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>

            <div class="form-actions">
                <a th:href="@{/user_student/examinations/examination-menu}" class="btn btn-secondary">🏠 Back to Menu</a>
            </div>
        </div>
    </section>
</main>

<div id="toast-container"></div>
<script src="/js/outcome.js"></script>
</body>
</html>
