<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<!-- ========================================================== -->
<!-- HEAD SECTION -->
<!-- ========================================================== -->
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" type="text/css" href="/css/booked-calendar.css">
</head>
<body>

<!-- ========================================================== -->
<!-- HEADER SECTION -->
<!-- ========================================================== -->
<header class="main-header">
    <div class="header-inner">

        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>

    </div>
</header>

<!-- ========================================================== -->
<!-- MAIN CONTENT -->
<!-- ========================================================== -->
<main class="content-wrapper">
    <header class="page-header fade-in">
        <h1>📅Appeals booked</h1>
    <p class="subtitle">Browse and delete your booked examination appeals</p>
    </header>

    <section class="table-card fade-in">
        <table>
            <thead>
                <tr>
                    <th>Degree Course</th>
                    <th>Course</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Delete Reservation</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appeal : ${appeals}">
                    <td th:text="${appeal.degreeCourse}">Degree course</td>
                    <td th:text="${appeal.course}">Course</td>
                    <td th:text="${appeal.description}">Description</td>
                    <td th:text="${appeal.date}">Date</td>
                    <td>
                        <form th:action="@{/api/v1/examination-appeal/delete-booked/{id}(id=${appeal?.getId()})}" method="post">
                            <button type="submit" class="delete-button">Delete</button>
                            <input type="hidden" name="_method" value="DELETE">
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="form-actions fade-in">
        <a th:href="@{/user_student/examinations/examination-menu}" class="home-link">🏠 Back to Menu</a>
    </div>
</main>

<!-- ===== TOASTS ===== -->
<div id="toast-container"></div>

<script src="/js/booked-calendar.js"></script>
</body>
</html>
