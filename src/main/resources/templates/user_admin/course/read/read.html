<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Journey | Read course</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/css/read-course.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<main class="container">

    <header class="page-header">
        <h1 class="main-title">Read course information</h1>
        <p class="subtitle">Search courses by name and degree course</p>
    </header>

    <div class="form-container">
        <form th:action="@{/api/v1/course/read/name}" method="get">

            <div class="input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="courseName" name="courseName" placeholder="Enter course name" required />
            </div>

            <div class="input-wrapper">
                <i class="fas fa-book"></i>
                <input type="text" id="degreeCourseName" name="degreeCourseName" placeholder="Enter degree course name" required />
            </div>

            <button type="submit" class="btn">Search</button>
            <input type="reset" value="Reset" class="btn reset-btn" />
        </form>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}">No course found!</p>
    </div>

    <div class="form-actions">
        <a th:href="@{/user_admin/course/course-menu}" class="home-link">← Back to Menu</a>
    </div>

</main>

</body>
</html>
