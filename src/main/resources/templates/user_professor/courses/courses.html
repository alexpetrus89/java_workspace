<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey — Teachings</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/courses.css">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/courses.js" defer></script>
</head>
<body>

<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<main class="container">
    <section class="page-header">
        <h1><i class="fa-solid fa-chalkboard-user"></i> Teachings</h1>
        <p class="subtitle">View and manage your assigned courses</p>
    </section>

    <section class="card-table">
        <table class="styled-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>CFU</th>
                    <th>Degree Course</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}" class="table-row">
                    <td th:text="${course.name}">Course name</td>
                    <td th:text="${course.type.name()}">Course type</td>
                    <td th:text="${course.cfu}">6</td>
                    <td th:text="${course.degreeCourse.name}">Degree Course</td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="form-actions">
        <a href="#" th:href="@{/user_professor/professor-home}" class="home-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to menu
        </a>
    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-bottom">
            <p>&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Uni Journey — All rights reserved.</p>
        </div>
    </div>
</footer>

<div id="toast-container"></div>
</body>
</html>
