<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey — Examination Menu</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/examination-menu.css">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/examination-menu.js" defer></script>
</head>

<body>

<!-- ========================================================== -->
<!-- HEADER SECTION -->
<!-- ========================================================== -->
<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<!-- ========================================================== -->
<!-- MAIN CONTENT -->
<!-- ========================================================== -->
<main class="container">

    <section class="page-header">
        <h1>Examination Menu</h1>
        <p class="subtitle">Access all your examination-related tools</p>
    </section>

    <!-- ===== Cards ===== -->
    <section class="card-grid">

        <article class="card accent-card">
            <div class="card-icon"><i class="fa-solid fa-book"></i></div>
            <h3>Booklet</h3>
            <p>Click <a th:href="@{/api/v1/examination/read/student/register}">here</a> to view your exam booklet.</p>
        </article>

        <article class="card accent-card">
            <div class="card-icon"><i class="fa-solid fa-calendar-check"></i></div>
            <h3>Available Appeals</h3>
            <p>Click <a th:href="@{/api/v1/examination-appeal/available/student}">here</a> to view available appeals.</p>
        </article>

        <article class="card accent-card">
            <div class="card-icon"><i class="fa-solid fa-clipboard-list"></i></div>
            <h3>Booked Appeals</h3>
            <p>Click <a th:href="@{/api/v1/examination-appeal/booked/student}">here</a> to view your booked appeals.</p>
        </article>

        <article class="card accent-card">
            <div class="card-icon"><i class="fa-solid fa-chart-line"></i></div>
            <h3>Evaluation</h3>
            <p>Click <a th:href="@{/api/v1/examination-outcome/read/all}">here</a> to check your results.</p>
        </article>

    </section>

    <!-- ===== Back Button ===== -->
    <div class="form-actions">
        <a th:href="@{/user_student/student-home}" class="home-link">🏠 Back to Home</a>
    </div>
</main>

<!-- Toast container -->
<div id="toast-container"></div>

</body>
</html>
