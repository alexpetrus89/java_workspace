<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/student-home.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/student-home.js" defer></script>
</head>

<body>

<main class="container">

    <header class="page-header">
        <h1>Welcome, <span sec:authentication="name"></span> 👋</h1>
        <p class="subtitle">Access all your academic tools and updates</p>
    </header>

    <section class="card-container">

        <div class="card study-card" data-sound="/static/sounds/mixkit-fast-rocket-whoosh-1714.wav">
            <div class="card-header">
                <span class="card-symbol">📘</span>
                <h2>Study Plan</h2>
            </div>
            <p>
                Click <a th:href="@{/api/v1/study-plan/read}">here <span class="arrow">→</span></a> to view your booklet
            </p>
        </div>

        <div class="card exam-card" data-sound="/static/sounds/mixkit-fast-rocket-whoosh-1714.wav">
            <div class="card-header">
                <span class="card-symbol">🧾</span>
                <h2>Examinations</h2>
            </div>
            <p>
                Click <a th:href="@{/user_student/examinations/examination-menu}">here <span class="arrow">→</span></a> to view examinations
            </p>
        </div>

        <div class="card info-card" data-sound="/static/sounds/mixkit-fast-rocket-whoosh-1714.wav">
            <div class="card-header">
                <span class="card-symbol">👤</span>
                <h2>Information</h2>
            </div>
            <p>
                Click <a th:href="@{/api/v1/user/update/student}">here <span class="arrow">→</span></a> to update your data
            </p>
        </div>

        <div class="card logout-card" data-sound="/static/sounds/mixkit-fast-rocket-whoosh-1714.wav">
            <div class="card-header">
                <span class="card-symbol">🚪</span>
                <h2>Logout</h2>
            </div>
            <p>
                Click <a th:href="@{/logout}">here <span class="arrow">→</span></a> to log out
            </p>
        </div>

    </section>

    <section id="notifications">
        <h2>🔔 Notifications</h2>
        <table id="conversation" class="table table-striped">
            <thead>
                <tr>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="notify"></tbody>
        </table>
    </section>

    <div class="form-actions">
        <a href="/" class="home-link">🏠 Home</a>
    </div>

</main>

<!-- Toast Container -->
<div id="toast-container"></div>

</body>
</html>
