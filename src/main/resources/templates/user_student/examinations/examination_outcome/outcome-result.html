<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey - Outcome</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/outcome-result-student.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="main-header">
    <div class="header-inner">

        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>

    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="content-wrapper">
    <section class="card-container">
        <div class="card" th:if="${outcome}" th:object="${outcome}">
            <h1 class="title">📋 Outcome</h1>

            <!-- Info esame -->
            <div class="appeal">
                <p><strong>Course:</strong> <span th:text="${outcome.appeal.course}"></span></p>
                <p><strong>Date:</strong> <span th:text="${#temporals.format(outcome.appeal.date, 'yyyy-MM-dd')}"></span></p>
                <p><strong>Grade:</strong> <span th:text="${outcome.grade}"></span></p>
                <p th:if="${outcome.withHonors}"><strong>With honors</strong></p>
            </div>

            <!-- Assente -->
            <div class="appeal" th:if="*{!present}">
                <p><strong>Result:</strong> Absent</p>
                <form th:action="@{/api/v1/examination-outcome/delete/{id}(id=${outcome.id})}" method="post" class="action">
                    <input type="hidden" name="_method" value="DELETE">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn">Confirm</button>
                </form>
            </div>

            <!-- Presente -->
            <div class="appeal" th:if="*{present}">

                <!-- Voto sufficiente -->
                <div th:if="*{grade} >= 18" class="appeal">
                    <form th:action="@{/api/v1/examination/create}" method="post" class="action">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="register" th:value="${outcome.register}">
                        <input type="hidden" name="courseName" th:value="${outcome.appeal.course}">
                        <input type="hidden" name="degreeCourseName" th:value="${outcome.appeal.degreeCourse}">
                        <input type="hidden" name="courseCfu" th:value="${outcome.appeal.courseCfu}">
                        <input type="hidden" name="grade" th:value="${outcome.grade}">
                        <input type="hidden" name="withHonors" th:value="${outcome.withHonors}">
                        <input type="hidden" name="date" th:value="${#temporals.format(outcome.appeal.date, 'yyyy-MM-dd')}">
                        <button type="submit" class="btn">Accept grade</button>
                    </form>

                    <form th:action="@{/user_student/examinations/examination_outcome/confirm-refusal}" method="get" class="action">
                        <button type="submit" class="btn">Refuse grade</button>
                    </form>
                </div>

                <!-- Voto insufficiente -->
                <div th:if="*{grade} < 18 and *{grade} >= 0" class="appeal">
                    <p><strong>Result:</strong> Insufficient</p>
                    <form th:action="@{/api/v1/examination-outcome/delete/{id}(id=${outcome.id})}" method="post" class="action">
                        <input type="hidden" name="_method" value="DELETE">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn">Confirm</button>
                    </form>
                </div>

                <!-- Voto fallito -->
                <div th:if="*{grade} < 0" class="appeal">
                    <p><strong>Result:</strong> Failed</p>
                </div>

            </div>

            <div class="action">
                <a th:href="@{/user_student/examinations/examination-menu}" class="btn">🏠 Back to Menu</a>
            </div>
        </div>
    </section>
</main>

<!-- ===== TOASTS ===== -->
<div id="toast-container"></div>

<script src="/js/outcome-result-student.js"></script>
</body>
</html>
