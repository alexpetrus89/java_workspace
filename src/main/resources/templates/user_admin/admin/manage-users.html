<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/css/manage-users.css">
    <script src="/js/filtering-users-for-manage.js" defer></script>
</head>
<body>

<header>
    <h1>Users management</h1>
</header>

<main>
    <div class="table-container">

        <!-- Search bar -->
        <div class="search-container">
            <input type="text" id="userSearch" placeholder="🔍 Search users...">
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cardsGrid">
            <div class="card" th:each="user : ${users}">
                <div class="card-header">
                    <span th:text="${user.username}" class="card-username"></span>
                    <span th:text="${user.role}" class="card-role"></span>
                </div>
                <div class="card-body">
                    <p><strong>Name:</strong> <span th:text="${user.firstName + ' ' + user.lastName}"></span></p>
                    <p><strong>Date of birth:</strong> <span th:text="${#temporals.format(user.dob, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Fiscal code:</strong> <span th:text="${user.fiscalCode}"></span></p>
                    <p><strong>Address:</strong> <span th:text="${user.address.street + ', ' + user.address.city + ', ' + user.address.country + ' ' + user.address.zipCode}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
                </div>
                <div class="card-footer">

                    <form th:action="@{/api/v1/user/update}" method="get">
                        <input type="hidden" name="role" th:value="${user.role.name().toLowerCase()}"/>
                        <input type="hidden" name="username" th:value="${user.username}"/>
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <button type="submit" class="btn update-btn">Update</button>
                    </form>

                    <form th:action="@{/api/v1/user/delete}" method="post">
                        <input type="hidden" name="_method" value="delete"/>
                        <input type="hidden" name="username" th:value="${user.username}"/>
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                        <button type="submit" class="btn delete-btn">Delete</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Back to Menu -->
    <div class="form-actions">
        <a th:href="@{/user_admin/admin/admin-menu}" class="home-link">Back to Menu</a>
    </div>
</main>

</body>
</html>
