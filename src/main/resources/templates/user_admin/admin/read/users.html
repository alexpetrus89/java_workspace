<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey - users</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/css/users.css">
    <script src="/js/filtering-users.js"></script>
</head>
<body>

<header>
    <h1>Uni Journey - Users</h1>
</header>

<main>
    <div class="table-container">

        <!-- Search bar -->
        <div class="search-container">
            <input type="text" id="userSearch" placeholder="Search users..." onkeyup="filterUsers()">
        </div>

        <!-- Desktop Table -->
        <table class="desktop-table" id="userTable">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Date of birth</th>
                    <th>Fiscal code</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                    <td th:text="${#temporals.format(user.dob, 'dd/MM/yyyy')}"></td>
                    <td th:text="${user.fiscalCode}"></td>
                    <td th:text="${user.address.street + ', ' + user.address.city + ', ' + user.address.country + ' ' + user.address.zipCode}"></td>
                    <td th:text="${user.phone}"></td>
                    <td th:text="${user.role}"></td>
                </tr>
            </tbody>
        </table>

        <!-- Mobile Cards -->
        <div class="mobile-cards">
            <div class="card" th:each="user : ${users}">
                <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                <p><strong>Name:</strong> <span th:text="${user.firstName + ' ' + user.lastName}"></span></p>
                <p><strong>Date of birth:</strong> <span th:text="${#temporals.format(user.dob, 'dd/MM/yyyy')}"></span></p>
                <p><strong>Fiscal code:</strong> <span th:text="${user.fiscalCode}"></span></p>
                <p><strong>Address:</strong> <span th:text="${user.address.street + ', ' + user.address.city + ', ' + user.address.country + ' ' + user.address.zipCode}"></span></p>
                <p><strong>Phone:</strong> <span th:text="${user.phone}"></span></p>
                <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
            </div>
        </div>
    </div>

    <!-- Back to Menu -->
    <div class="form-actions">
        <a th:href="@{/user_admin/admin/admin-menu}" class="home-link">Back to Menu</a>
    </div>
</main>

</body>
</html>
