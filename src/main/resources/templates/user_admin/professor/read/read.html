<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/css/read-professor.css">
    <script src="/js/professor-code-validator.js" type="module"></script>
</head>
<body>

    <h1 class="main-title">Professor information</h1>

    <div class="form-container">
        <h2>Search by professor code</h2>
        <form id="professorCodeForm" th:action="@{/api/v1/professor/read/professor-code}" method="get">
            <input type="text" id="professorCode" name="professorCode" placeholder="Enter professor code" required />
            <button type="submit">Search</button>
            <input type="reset" value="Reset" />
        </form>
    </div>

    <p id="professorCodeError" class="error-message"></p>

    <div class="form-container">
        <h2>Search by professor fullname</h2>
        <form th:action="@{/api/v1/professor/read/name}" method="get">
            <input type="text" name="fullName" placeholder="Enter professor name" required />
            <button type="submit">Search</button>
            <input type="reset" value="Reset" />
        </form>
    </div>

    <div class="form-actions">
        <a th:href="@{/user_admin/professor/professor-menu}" class="home-link">Back to Menu</a>
    </div>

</body>
</html>
