<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Journey - Study Plan</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/css/study-plan-read.css">
</head>

<body>
<!-- ===== HEADER ===== -->
<header class="main-header">
    <div class="header-inner">

        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="content-wrapper">
    <section class="card fade-in">
        <h1 class="title">📚 Study plan</h1>

        <p class="ordering">
            <strong>Ordering:</strong> <span th:text="${studyPlan.ordering}">ordering</span>
        </p>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-section">
            <h3>🎯 Your Academic Progress</h3>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <div class="progress-stats">
                    <p id="progress-info">Loading your progress...</p>
                </div>
            </div>
        </div>

        <!-- ===== TABLE ===== -->
        <div class="table-container">
            <table class="styled-table">
                <thead>
                    <tr>
                        <th>Degree Course</th>
                        <th>Course</th>
                        <th>CFU</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${studyPlan.courses}">
                        <td th:text="${course.degreeCourse.name}">degree course</td>
                        <td th:text="${course.name}">course name</td>
                        <td th:text="${course.cfu}">course cfu</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td><strong>Total University Credits</strong></td>
                        <td></td>
                        <td id="total-cfu" th:text="${#aggregates.sum(studyPlan.courses.![cfu])}">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- ===== ACTIONS ===== -->
        <div class="actions">
            <h2>✏️ Modify</h2>
            <p>
                Click <a th:href="@{/api/v1/study-plan/change}" class="link">here</a> to modify your study plan.
            </p>

            <a th:href="@{/user_student/student-home}" class="btn">🏠 Back to Home</a>
        </div>
    </section>
</main>

<!-- ===== JS ===== -->
<script src="/js/study-plan-read.js"></script>
</body>
</html>
