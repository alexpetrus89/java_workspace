<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/change-degree-course.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/upload-degree-courses.js"></script>
</head>
<body>
    <div class="container">
        <h1>Change student degree course</h1>

        <form id="registerForm" th:action="@{/api/v1/student/change-degree-course}" th:object="${form}" method="post">

            <label for="register">Student Register:</label>
            <input type="text" id="register" th:field="*{register}" placeholder="Enter student register" required>

            <div id="registerError" class="error-message">
                No student found with this register.
            </div>

            <label for="degreeCourse">Degree Course:</label>
            <select id="degreeCourse" name="degreeCourse" required>
                <option value="">-- Select a degree course --</option>
                <option th:each="degreeCourse : ${degreeCourses}"
                        th:value="${degreeCourse.name}"
                        th:text="${degreeCourse.name}">
                </option>
            </select>

            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <br><br>
            <button type="submit">Update degree course</button>
        </form>

        <!-- Message card -->
        <div id="messageCard" class="message-card"></div>

        <div class="form-actions">
            <a th:href="@{/user_admin/student/student-menu}" class="home-link">Back to Menu</a>
        </div>
    </div>
    <script src="/js/register-validator.js" type="module"></script>
</body>
</html>
