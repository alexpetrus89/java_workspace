<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">

<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey — Students booked</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="/css/students-booked.css">
</head>

<body>
<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <!-- Dark/Light Toggle -->
        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<main class="container">
    <div class="content-card fade-in">
        <h2>Students booked</h2>
        <p class="subtitle">Below is the list of students registered for this appeal.</p>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Registration</th>
                    <th>Email</th>
                    <th>Degree Course</th>
                    <th>Evaluation</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${appeal.students}">
                    <td th:text="${student.firstName} + ' ' + ${student.lastName}">Name</td>
                    <td th:text="${student.register}">Register</td>
                    <td th:text="${student.username}">Email</td>
                    <td th:text="${student.degreeCourse.name}">Degree Course</td>
                    <td>
                        <a class="action-link"
                           th:href="@{/api/v1/examination-outcome/make/{register}/{id}(register=${student.register}, id=${appeal.id})}"
                           th:if="${appeal.date lt T(java.time.LocalDate).now()}">
                            Evaluate
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="total">
            <span th:text="'Total registered students: ' + ${#lists.size(appeal.students)}">
                Total registered students: 0
            </span>
        </div>

        <div class="form-actions">
            <a th:href="@{/api/v1/examination-appeal/read/professor}" class="home-link">Back to Check</a>
            <a th:href="@{/user_professor/examinations/examination_appeal/examination-appeal-menu}" class="home-link">Back to Menu</a>
        </div>
    </div>
</main>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
<script src="/js/students-booked.js" defer></script>
</body>
</html>
