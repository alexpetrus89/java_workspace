<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Uni Journey — Create Examination Appeal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="/css/create-examination-appeal.css">

    <!-- Icons + JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <script src="/js/create-examination-appeal.js" defer></script>
</head>

<body>
<header class="main-header">
    <div class="header-inner">
        <div class="logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="20" height="6" rx="1.5" fill="#2563eb"/>
                <rect x="2" y="13" width="20" height="8" rx="2" fill="#1e40af"/>
            </svg>
            <h1 class="brand">UNI JOURNEY</h1>
        </div>

        <!-- Dark/Light Toggle -->
        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon"></i>
        </div>
    </div>
</header>

<main class="container">
    <div class="appeal-card fade-in">
        <h2>Make new appeal</h2>

        <form th:action="@{/api/v1/examination-appeal/create}" method="post" class="appeal-form">
            <div class="form-group">
                <label for="courseName">Select course</label>
                <select name="courseName" id="courseName" required>
                    <option value="" disabled selected>Courses</option>
                    <option th:each="course : ${courses}"
                            th:value="${course.name}"
                            th:data-degree="${course.degreeCourse.name}"
                            th:data-cfu="${course.cfu}"
                            th:text="${course.name + ' - ' + course.degreeCourse.name}">Course</option>
                </select>
                <input type="hidden" id="degreeCourseName" name="degreeCourseName">
                <input type="hidden" id="courseCfu" name="courseCfu">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" placeholder="Enter description" required>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>

        <div class="nav-links">
            <a th:href="@{/user_professor/examinations/examination_appeal/examination-appeal-menu}" class="home-link">
                Back to Menu
            </a>
        </div>
    </div>
</main>

</body>
</html>
