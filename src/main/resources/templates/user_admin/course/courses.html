<!DOCTYPE html>
<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni Journey | Courses</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/css/courses.css">
    <script src="/js/filtering-users.js"></script>
</head>
<body>

    <header class="page-header">
        <div class="title-wrapper">
            <div class="icon-circle">
                🎓
            </div>
            <h1 class="main-title">Courses</h1>
        </div>
        <p class="subtitle">Explore all available courses in your uni journey</p>
    </header>

    <main class="container">

        <!-- 🔍 Search bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search course by name or professor...">
        </div>

        <!-- 📋 Table -->
        <div class="table-container">
            <table class="styled-table" id="coursesTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>CFU</th>
                        <th>Professor</th>
                        <th>Degree Course</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.name}">Course name</td>
                        <td th:text="${course.type.name()}">Course type</td>
                        <td th:text="${course.cfu}">Cfu</td>
                        <td th:text="${course.professor?.fullName}">Professor</td>
                        <td th:text="${course.degreeCourse.name}">Degree Course</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-actions">
            <a th:href="@{/user_admin/course/course-menu}" class="home-button">
                ← Back to Menu
            </a>
        </div>
    </main>
    <script src="/static/js/filtering-users.js"></script>
</body>
</html>
